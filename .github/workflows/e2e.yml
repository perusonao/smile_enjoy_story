name: Playwright E2E (S.E.S.)

# Single workflow for validation + E2E + Replay Package + Pages deploy.
#
# Previously this repo used two workflows: this one (validation/E2E, all
# events) and a separate deploy.yml triggered by `workflow_run` once this
# one completed on main. That cross-workflow `workflow_run` trigger never
# fired in practice across two independent main pushes (confirmed via the
# GitHub API: zero workflow_run-triggered runs, repo-wide, ever) despite
# the trigger being correctly configured (name match, no branches filter,
# no job-if skip involved — the run itself was never created). Root cause
# on GitHub's side could not be confirmed from the repo alone, so rather
# than keep depending on that cross-workflow event, deploy is now just
# more jobs in this same workflow run, wired together with `needs:` —
# no event hand-off, nothing to fail to fire.
#
# jobs:
#   validate       — pull_request / push / workflow_dispatch. Flutter
#                    analyze/test/build + Replay Viewer unit tests. The
#                    one shared gate `e2e-chromium`/`e2e-webkit` both wait
#                    on, so neither browser project pays for a second
#                    Flutter build.
#   e2e-chromium   — needs: validate. Playwright's mobile-chromium project
#                    only, on its own GitHub-hosted runner.
#   e2e-webkit     — needs: validate. Playwright's mobile-webkit project
#                    only, on its own GitHub-hosted runner. Split from
#                    e2e-chromium (PR #15 CI investigation: both projects
#                    used to run as 2 workers *on the same 2-core runner*,
#                    §git history of this file for the CDP-throttle
#                    measurements that first identified this contention) so
#                    the two browser engines no longer compete for the same
#                    CPU — each now gets its own runner's full 2 cores.
#                    `workers` inside playwright.config.ts is deliberately
#                    left untouched by this split (still `2` under CI): with
#                    only one project selected per job (`--project=...`),
#                    that setting now only parallelizes *that job's own*
#                    spec files, not two different browser engines against
#                    each other — a real, structural difference from the
#                    single-job design, not a value that needed editing.
#   replay-package — push only. Downloads *both* browsers' raw Playwright
#                    results (uploaded by e2e-chromium/e2e-webkit) and
#                    merges them into one `test-results/` tree + one merged
#                    `playwright-report.json` before running the existing
#                    `npm run build:replay` unchanged — same replay-package
#                    output shape as when a single job produced both
#                    browsers' results directly. Needed because splitting
#                    Playwright's own JSON reporter output across two job
#                    runs would otherwise scatter it into two reports.
#                    QA-only tool, not part of the game: `build` does NOT
#                    `needs:` this job (see `build` below), and it carries
#                    its own bounded `timeout-minutes` so a stuck step here
#                    (e.g. `apt-get install ffmpeg` hanging) can never stall
#                    the game's Pages deploy — it can only cost itself up to
#                    that timeout before failing on its own.
#   check-latest   — push / workflow_dispatch only. Stale-run guard (see
#                    e2e/scripts/check-latest-main.mjs): is this run's
#                    commit still origin/main's actual tip?
#   build          — Flutter web release build + best-effort fold-in of this
#                    *same run's* e2e-replay-package artifact (no cross-run
#                    token/run-id needed — it's the same workflow run) +
#                    upload-pages-artifact. Deliberately does NOT `needs:
#                    replay-package` — replay packaging is a QA convenience,
#                    not a game-deploy gate, and nothing here ever reads
#                    `needs.replay-package.result`. In practice `build`'s own
#                    checkout/Flutter-install/analyze/test/build-web steps
#                    take longer than replay-package's own run, so by the
#                    time `build` reaches "Download e2e-replay-package" the
#                    artifact has almost always already been uploaded. If
#                    replay-package is still running (or failed, or hit its
#                    timeout) when `build` gets there, the download step
#                    (`continue-on-error: true`) simply finds nothing and
#                    `build` deploys the game without updating
#                    /e2e-replays/ this time. That specific run's replay is
#                    NOT retried, queued, or picked up by any later run —
#                    `actions/download-artifact` with no `run-id` only ever
#                    searches the *current* workflow run, so a late
#                    `replay-package` artifact is unreachable once this run's
#                    `build` has already moved on. It is simply never
#                    published; the next thing a viewer sees in
#                    /e2e-replays/ is whichever *separate, new* replay a
#                    later push's own `replay-package` produces, if that one
#                    also finishes in time for that push's own `build`
#                    (Phase 1 scope — see PHASE2 note below for a dedicated
#                    replay-only follow-up deployment that would let a late
#                    artifact still get published).
#   deploy         — re-verify the stale guard immediately before
#                    actions/deploy-pages (build's flutter build web can
#                    take minutes; re-check right at the point of no
#                    return), then deploy.
#
# A failed e2e-chromium/e2e-webkit job does NOT by itself block
# check-latest/build/deploy — matching the previous design's intent ("a red
# E2E run does not block the game deployment"). Likewise, replay-package
# failing, timing out, or simply not having finished yet does NOT block
# build/deploy (§ `build` above) — it is QA/dev tooling, not the game. What
# DOES block deploy: `check-latest`/`build` actually failing (build re-runs
# flutter analyze/test against the same commit as its own independent gate
# — deliberately not deduplicated against `validate`'s copy, so a broken
# build is never shipped regardless of what happened in the
# Playwright/replay portion), the stale-SHA guard failing either check, or
# either E2E job being cancelled/skipped (e.g. superseded by a newer push —
# a cancelled run has no reliable replay package and a newer run's chain
# deploys right behind it anyway).
#
# WebKit compatibility is also intentionally non-blocking for ordinary PR
# merge readiness. `e2e-webkit` remains a real failing job when its tests
# fail (including its always-uploaded artifacts), but its failure does not
# fail the workflow run. This is a temporary policy boundary for the known
# WebKit infrastructure flake; remove `continue-on-error` when that separate
# stabilization work has made WebKit reliable enough to become a gate again.
#
# PHASE2 (not implemented — future option, see task report): today a
# replay that finishes packaging *after* its push's own `build`/`deploy`
# already ran is simply never published — it is NOT retried, queued, or
# folded into any later run (`actions/download-artifact` with no `run-id`
# only ever looks at the current workflow run). The next replay a viewer
# sees is whatever separate, new replay a *later* push's own
# `replay-package` produces, if that one finishes in time for that push's
# own `build` (Phase 1 "best effort this run, else that run's replay is
# lost" design). A dedicated follow-up job that re-runs `configure-pages`/
# `upload-pages-artifact`/`deploy-pages` once replay-package finishes late
# would need its own copy of the already-built `build/web` (or to re-run
# `flutter build web`) plus the same `check-latest`/stale-SHA re-verification
# `deploy` already does, to avoid redeploying a stale commit's game purely
# to attach a replay. Left out of this change as out of scope for a minimal
# fix.
#
# PRs only ever run validate/e2e-chromium/e2e-webkit (see each downstream
# job's `if:`) — no Pages deploy happens for pull_request events.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seeds:
        description: "Comma-separated seed list for founding-first-assignment.spec.ts (default: fast 3-seed sample; use the 10-seed set for a full validation pass)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: e2e-validate-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable

      - name: flutter pub get
        working-directory: .
        run: flutter pub get

      - name: flutter analyze
        working-directory: .
        run: flutter analyze

      - name: flutter test
        working-directory: .
        run: flutter test

      - name: flutter build web (release, no CDN — self-contained for the local static server)
        working-directory: .
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr_number="$EVENT_PR_NUMBER"
          if [[ -z "$pr_number" ]]; then
            subject="$(git show -s --format=%s "$GITHUB_SHA")"
            merge_subject_pattern='^Merge pull request #([0-9]+) from '
            if [[ "$subject" =~ $merge_subject_pattern ]]; then
              pr_number="${BASH_REMATCH[1]}"
            fi
          fi
          build_info=(--dart-define="BUILD_COMMIT_SHA=$GITHUB_SHA")
          if [[ -n "$pr_number" ]]; then
            build_info+=(--dart-define="BUILD_PR_NUMBER=$pr_number")
          fi
          flutter build web --release --no-web-resources-cdn "${build_info[@]}"

      # e2e-chromium/e2e-webkit run on their own separate runners (§ jobs
      # comment above), so the just-built web app has to travel to them as
      # an artifact rather than being found on disk the way a single
      # combined job could rely on.
      - name: Upload build/web (for e2e-chromium/e2e-webkit)
        uses: actions/upload-artifact@v4
        with:
          name: build-web
          path: build/web/**
          retention-days: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install E2E dependencies
        run: npm ci

      # Pure Node unit tests for the Replay Viewer's own build tooling
      # (manifest builder, latest-main deploy guard, viewer escaping/
      # filtering logic) — no browser needed, so this runs before the
      # (much slower) Playwright browser install/run below and fails fast.
      # No continue-on-error: a failure here must fail this job exactly
      # like any other step.
      - name: Replay unit tests
        run: npm run test:replay-unit

  e2e-chromium:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: e2e-chromium-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install E2E dependencies
        run: npm ci

      - name: Download build/web
        uses: actions/download-artifact@v4
        with:
          name: build-web
          path: build/web

      - name: Install Playwright browsers (chromium only — this job never touches webkit)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E (mobile-chromium)
        env:
          SES_E2E_SEEDS: ${{ github.event.inputs.seeds }}
          CI: "true"
          # Always keep video, not just on failure — playwright.config.ts's
          # default is retain-on-failure, so a passing run otherwise leaves
          # no recording to review.
          SES_E2E_VIDEO: "on"
        run: npx playwright test --project=mobile-chromium

      - name: Upload ses-playwright-results (mobile-chromium)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ses-playwright-results-mobile-chromium
          path: |
            e2e/test-results/**
            e2e/playwright-report/**
          retention-days: 10
          if-no-files-found: warn

  e2e-webkit:
    needs: validate
    # Keep a failing WebKit run visible and artifact-backed, without making
    # its known infrastructure flake a blocking Public Demo PR gate.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: e2e-webkit-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install E2E dependencies
        run: npm ci

      - name: Download build/web
        uses: actions/download-artifact@v4
        with:
          name: build-web
          path: build/web

      - name: Install Playwright browsers (webkit only — this job never touches chromium)
        run: npx playwright install --with-deps webkit

      - name: Run Playwright E2E (mobile-webkit)
        env:
          SES_E2E_SEEDS: ${{ github.event.inputs.seeds }}
          CI: "true"
          SES_E2E_VIDEO: "on"
        run: npx playwright test --project=mobile-webkit

      - name: Upload ses-playwright-results (mobile-webkit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ses-playwright-results-mobile-webkit
          path: |
            e2e/test-results/**
            e2e/playwright-report/**
          retention-days: 10
          if-no-files-found: warn

  # --- E2E Replay Viewer package (dev/QA tool) ------------------------
  #
  # main-only, and deliberately `if: always()`: a FAILED E2E run is exactly
  # when the replay video is most worth having, so this must still run
  # whether e2e-chromium/e2e-webkit passed or failed. It must NOT and does
  # not change either job's own pass/fail result (§ approved design:
  # "テスト失敗をgreenに変えてはいけません") — this job only ever packages
  # already-decided results, never re-runs or re-scores anything.
  replay-package:
    needs: [e2e-chromium, e2e-webkit]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    # QA-only packaging job — bounded so a stuck step (e.g. `apt-get install
    # ffmpeg` hanging on the runner image, as in run 32168277905) fails this
    # job on its own instead of running for GitHub's 360-minute default.
    # 10 minutes is ~5-6x the slowest confirmed normal completion (run
    # 32152694510: full job 15:19:15Z-15:20:59Z = 1m44s, of which the
    # `apt-get install ffmpeg` step alone took 48s) — enough headroom for apt
    # slowness, not so long that a real hang still stalls the next push's
    # replay-package (its own concurrency group would otherwise queue behind
    # a hung run for the remainder of that hang).
    timeout-minutes: 10
    concurrency:
      group: e2e-replay-package-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install E2E dependencies
        run: npm ci

      # Each browser job uploaded its own isolated test-results/ tree
      # (including its own playwright-report.json). Merge both back into
      # the single `test-results/` shape `npm run build:replay` already
      # expects — unchanged since before this split, so no change to
      # scripts/build-replay-manifest.mjs itself is needed. Playwright's
      # own per-test output folder names already embed the project name
      # (e.g. "...-mobile-chromium", "...-mobile-webkit" — confirmed from
      # this repo's own prior CI logs), so copying both trees into one
      # directory cannot collide.
      - name: Download both browsers' raw results
        uses: actions/download-artifact@v4
        with:
          pattern: ses-playwright-results-*
          path: e2e/raw-results

      - name: Merge both browsers' test-results into one tree + one report
        run: |
          set -euo pipefail
          mkdir -p test-results
          for dir in raw-results/*/test-results; do
            [ -d "$dir" ] && cp -r "$dir"/. test-results/
          done
          node -e '
            const fs = require("fs");
            const glob = require("fs").readdirSync("raw-results")
              .map((d) => `raw-results/${d}/test-results/playwright-report.json`)
              .filter((p) => fs.existsSync(p));
            if (glob.length === 0) throw new Error("no playwright-report.json found under raw-results/*/test-results/");
            const reports = glob.map((p) => JSON.parse(fs.readFileSync(p, "utf-8")));
            const merged = {
              ...reports[0],
              suites: reports.flatMap((r) => r.suites ?? []),
              errors: reports.flatMap((r) => r.errors ?? []),
            };
            fs.writeFileSync("test-results/playwright-report.json", JSON.stringify(merged));
            console.log(`merged ${glob.length} report(s) -> test-results/playwright-report.json`);
          '

      # ubuntu-latest (24.04) does not ship ffmpeg/ffprobe — confirmed by
      # run 31894678795 failing with "spawnSync ffmpeg ENOENT" and by the
      # runner image's own installed-software list (actions/runner-images).
      # CI-runner-only: not a Flutter, npm, or production runtime dependency.
      - name: Install ffmpeg (CI runner only — for replay MP4 transcoding)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Build E2E replay package
        env:
          SES_REPLAY_RUN_ID: ${{ github.run_id }}
          SES_REPLAY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SES_REPLAY_COMMIT_SHA: ${{ github.sha }}
          SES_REPLAY_WORKFLOW: ${{ github.workflow }}
          SES_REPLAY_EVENT: ${{ github.event_name }}
        run: npm run build:replay

      - name: Upload e2e-replay-package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-replay-package
          path: e2e/replay-package/**
          retention-days: 10
          if-no-files-found: warn

  check-latest:
    needs: [e2e-chromium, e2e-webkit]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.e2e-chromium.result != 'cancelled' &&
      needs.e2e-chromium.result != 'skipped' &&
      needs.e2e-webkit.result != 'cancelled' &&
      needs.e2e-webkit.result != 'skipped'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      target_sha: ${{ steps.check.outputs.target_sha }}
      is_latest: ${{ steps.check.outputs.is_latest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve target commit and check it is still main's current tip
        id: check
        run: node e2e/scripts/check-latest-main.mjs "${{ github.sha }}" "https://github.com/${{ github.repository }}.git" "main" >> "$GITHUB_OUTPUT"
      - name: Stale run — log and skip
        if: steps.check.outputs.is_latest != 'true'
        run: echo "::warning::Stale run for commit ${{ steps.check.outputs.target_sha }} — main's current tip has moved on. Skipping the Pages deploy for this run to avoid rolling production back."

  # Deliberately does not `needs: replay-package` — see § `build` in the
  # jobs comment above. Nothing in this job (or `deploy`) reads
  # `needs.replay-package.result`; the download step below already treats a
  # missing/not-yet-ready artifact as a warning, not a failure.
  build:
    needs: [e2e-chromium, e2e-webkit, check-latest]
    if: |
      always() &&
      needs.check-latest.result == 'success' &&
      needs.check-latest.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    # Least privilege (Codex review, PR #7): only build/deploy need Pages
    # credentials — kept off the workflow-level default so the E2E jobs
    # (which run npm ci / Playwright / test code on every PR) never hold
    # them.
    permissions:
      contents: read
      pages: write
      actions: read # to download this run's own e2e-replay-package artifact
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-latest.outputs.target_sha }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web (release)
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr_number="$EVENT_PR_NUMBER"
          if [[ -z "$pr_number" ]]; then
            subject="$(git show -s --format=%s "$GITHUB_SHA")"
            merge_subject_pattern='^Merge pull request #([0-9]+) from '
            if [[ "$subject" =~ $merge_subject_pattern ]]; then
              pr_number="${BASH_REMATCH[1]}"
            fi
          fi
          build_info=(--dart-define="BUILD_COMMIT_SHA=$GITHUB_SHA")
          if [[ -n "$pr_number" ]]; then
            build_info+=(--dart-define="BUILD_PR_NUMBER=$pr_number")
          fi
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --no-web-resources-cdn \
            "${build_info[@]}"

      # --- E2E Replay Viewer (dev/QA tool) — folded into the same deploy ---
      #
      # Never touches lib/, web/, or any production build step above; this
      # only adds a static subdirectory to the already-built output.
      # Same workflow run as `replay-package`, so no run-id/cross-run token
      # needed — this simply downloads the artifact that job's own upload
      # step produces, IF that job has already produced it by the time this
      # step runs. `build` no longer `needs: replay-package` (§ jobs comment
      # at the top of this file), so this is a best-effort race, not a
      # guarantee: absent when `replay-package` didn't run at all (e.g. a
      # workflow_dispatch run), itself failed/timed out, or simply hasn't
      # finished uploading yet. Any of those is treated identically —
      # `continue-on-error` below turns "not found" into a warning, never a
      # failure.
      - name: Download e2e-replay-package
        id: download_replay
        continue-on-error: true # missing/failed artifact must not block the game deploy
        uses: actions/download-artifact@v4
        with:
          name: e2e-replay-package
          path: e2e-replay-download

      - name: Assemble Replay Viewer into the Pages payload
        if: steps.download_replay.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p build/web/e2e-replays
          cp -r e2e/replay-viewer/. build/web/e2e-replays/
          find build/web/e2e-replays -name '*.test.mjs' -delete
          cp -r e2e-replay-download/. build/web/e2e-replays/
          echo "Replay Viewer assembled at build/web/e2e-replays/ ($(find build/web/e2e-replays -type f | wc -l) files)"

      - name: Replay package unavailable for this deployment
        if: steps.download_replay.outcome != 'success'
        run: |
          echo "::warning::e2e-replay-package artifact not found for this run (event=${{ github.event_name }}) — deploying the game without updating /e2e-replays/ this time."

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: [check-latest, build]
    if: |
      always() &&
      needs.check-latest.result == 'success' &&
      needs.build.result == 'success' &&
      needs.check-latest.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Re-verify RIGHT BEFORE the real deploy-pages call — the
      # authoritative gate. `build`'s own `flutter build web` can take
      # several minutes; a newer commit could have become main's tip during
      # that window even though this run passed the check-latest job's
      # earlier (best-effort/efficiency-only) check.
      - name: Re-verify main has not moved since this run started
        id: recheck
        run: node e2e/scripts/check-latest-main.mjs "${{ needs.check-latest.outputs.target_sha }}" "https://github.com/${{ github.repository }}.git" "main" >> "$GITHUB_OUTPUT"

      - name: Stale at deploy time — skip deploy-pages
        if: steps.recheck.outputs.is_latest != 'true'
        run: echo "::warning::main moved during this run (target ${{ needs.check-latest.outputs.target_sha }} vs current ${{ steps.recheck.outputs.current_sha }}) — refusing to deploy a stale commit over a newer one."

      - id: deployment
        if: steps.recheck.outputs.is_latest == 'true'
        uses: actions/deploy-pages@v4
