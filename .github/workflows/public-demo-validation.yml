name: Public Demo Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/game/public_demo/**'
      - 'lib/ui/public_demo/**'
      - 'lib/presentation/build_info.dart'
      - 'test/game/public_demo/**'
      - 'test/ui/public_demo/**'
      - '.github/workflows/public-demo-validation.yml'
  workflow_dispatch:

concurrency:
  group: public-demo-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-public-demo:
    name: Public Demo only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Dependencies
        run: flutter pub get
      - name: Analyze Public Demo files
        run: flutter analyze lib/game/public_demo lib/ui/public_demo
      - name: Public Demo unit tests
        run: flutter test test/game/public_demo
      - name: Interview result dialog tests
        run: flutter test test/ui/public_demo/public_demo_interview_result_dialog_test.dart
      - name: Public Demo recovery playthrough
        run: flutter test test/ui/public_demo/public_demo_01_playthrough_test.dart
      - name: Public Demo success playthrough
        run: flutter test test/ui/public_demo/public_demo_01_success_playthrough_test.dart
      - name: Build web
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr_number="$EVENT_PR_NUMBER"
          if [[ -z "$pr_number" ]]; then
            subject="$(git show -s --format=%s "$GITHUB_SHA")"
            if [[ "$subject" =~ ^Merge\ pull\ request\ \#([0-9]+)\ from\ ]]; then
              pr_number="${BASH_REMATCH[1]}"
            fi
          fi
          build_info=(--dart-define="BUILD_COMMIT_SHA=$GITHUB_SHA")
          if [[ -n "$pr_number" ]]; then
            build_info+=(--dart-define="BUILD_PR_NUMBER=$pr_number")
          fi
          flutter build web --release "${build_info[@]}"
