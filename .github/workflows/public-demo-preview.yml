name: Public Demo Preview

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'lib/app/app_entry.dart'
      - 'lib/app/app_experience.dart'
      - 'lib/game/public_demo/**'
      - 'lib/ui/public_demo/**'
      - 'lib/presentation/build_info.dart'
      - 'lib/main.dart'
      - '.github/workflows/public-demo-preview.yml'

concurrency:
  group: public-demo-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build Public Demo browser preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - run: flutter pub get
      - name: Build standalone web preview
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr_number="$EVENT_PR_NUMBER"
          if [[ -z "$pr_number" ]]; then
            subject="$(git show -s --format=%s "$GITHUB_SHA")"
            if [[ "$subject" =~ ^Merge\ pull\ request\ \#([0-9]+)\ from\ ]]; then
              pr_number="${BASH_REMATCH[1]}"
            fi
          fi
          build_info=(--dart-define="BUILD_COMMIT_SHA=$GITHUB_SHA")
          if [[ -n "$pr_number" ]]; then
            build_info+=(--dart-define="BUILD_PR_NUMBER=$pr_number")
          fi
          flutter build web --release --base-href /public-demo-01/ "${build_info[@]}"
      - name: Add preview launcher
        run: |
          cat > build/web/PLAY_PUBLIC_DEMO.txt <<'EOF'
          Public Demo 0.1 browser entry:
          /public-demo-01/#/public-demo-01
          EOF
      - name: Upload standalone preview
        uses: actions/upload-artifact@v4
        with:
          name: public-demo-01-web-preview
          path: build/web
          retention-days: 14
