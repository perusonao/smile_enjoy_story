name: Apply Public Demo UX3 application event patch

on:
  push:
    branches: [codex/public-demo-01-mvp-a]
    paths:
      - .github/workflows/public-demo-ux3-application-event-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/public-demo-01-mvp-a
      - name: Wire application event into April to May transition
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/ui/public_demo/public_demo_01_placeholder_screen.dart')
          text = p.read_text()
          text = text.replace(
              "import 'public_demo_interview_result_dialog.dart';\n",
              "import '../asset_paths.dart';\nimport 'public_demo_event_dialog.dart';\nimport 'public_demo_interview_result_dialog.dart';\n",
              1,
          )
          old = "void april(){final o=engineers.where((e)=>e.stage==PublicDemoSalesStage.ordered).length;setState(()=>s=s.advanceToMay(monthlyExpenses:expense,orderedEngineers:o));}"
          new = "Future<void> april()async{final o=engineers.where((e)=>e.stage==PublicDemoSalesStage.ordered).length;setState(()=>s=s.advanceToMay(monthlyExpenses:expense,orderedEngineers:o));if(!mounted)return;await showDialog<void>(context:context,builder:(context)=>const PublicDemoEventDialog(title:'新しい応募が届きました',imageAsset:AssetPaths.eventRecruitmentApplication,imageKey:Key('public-demo-recruitment-application-image'),message:'採用候補者から応募が届いています。',nextAction:'候補者の経歴書を確認しましょう。'));}"
          if old not in text:
              raise SystemExit('April transition target not found')
          p.write_text(text.replace(old, new, 1))

          for name in [
              'test/ui/public_demo/public_demo_01_playthrough_test.dart',
              'test/ui/public_demo/public_demo_01_success_playthrough_test.dart',
          ]:
              p = Path(name)
              text = p.read_text()
              needle = "    await tapAndSettle(tester, '4月終了→5月');\n    expect(find.text('5月'), findsOneWidget);"
              replacement = "    await tapAndSettle(tester, '4月終了→5月');\n    expect(find.text('新しい応募が届きました'), findsOneWidget);\n    expect(find.byKey(const Key('public-demo-recruitment-application-image')), findsOneWidget);\n    await tester.tap(find.widgetWithText(FilledButton, '確認'));\n    await tester.pumpAndSettle();\n    expect(find.text('5月'), findsOneWidget);"
              if needle not in text:
                  raise SystemExit(f'Test transition target not found: {name}')
              p.write_text(text.replace(needle, replacement, 1))

          Path('.github/workflows/public-demo-ux3-application-event-patch.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- lib/ui/public_demo/public_demo_01_placeholder_screen.dart test/ui/public_demo/public_demo_01_playthrough_test.dart test/ui/public_demo/public_demo_01_success_playthrough_test.dart .github/workflows/public-demo-ux3-application-event-patch.yml
          git commit -m "feat(public-demo): show recruitment application event in May"
          git push origin HEAD:codex/public-demo-01-mvp-a
