name: Fast CI (S.E.S.)

# SES-CI-SPEED-1: fast, always-on CI + Pages deploy. The one job here that
# drives real browser UI (`smoke-e2e`) is a deliberately small, curated
# subset of the full Playwright suite (see e2e/tests/): app launch, Public
# Demo entry/basic HOME display, and the single most important short
# progression check (Founding -> First Assignment, 3-seed sample). This is
# the CI every normal UI/gameplay PR waits on, so it must stay minutes, not
# tens of minutes.
#
# Everything else that used to run here — WebKit (all specs), the annual
# April->March baseline, the late-year Recovery Loop's full pattern set, and
# multi-viewport checks — moved to `.github/workflows/e2e-heavy.yml`
# (manual `workflow_dispatch` + a weekly schedule). That workflow is fully
# independent of this one: it never gates `build`/`deploy` below, so a red
# or slow heavy run can never hold up an ordinary main deploy. See that
# file's own header for what it covers.
#
# jobs:
#   flutter-validate — pull_request / push / workflow_dispatch. Flutter
#                analyze/test/build (SES-CI-SPEED-3: built with the same
#                `--base-href` GitHub Pages deploys, so this one build is
#                reused by both `smoke-e2e` and `build` below).
#   replay-unit — the locked Replay Viewer unit-test gate. It runs in
#                parallel with `flutter-validate`; both must pass.
#   smoke-e2e  — needs: flutter-validate + replay-unit. Playwright's mobile-chromium project only,
#                restricted to the curated smoke spec list above (see the
#                `Run Playwright E2E (smoke, mobile-chromium)` step below for
#                the exact file list), against `flutter-validate`'s own build/web
#                artifact served through a base-href-aware local static
#                server (`e2e/scripts/static-server.js`). This is the "毎回
#                必要な高速CI" half of SES-CI-SPEED-1; it is a blocking gate
#                for `build`/`deploy`.
#   replay-package — push only. Packages `smoke-e2e`'s own chromium results
#                into the existing Replay Viewer output (`npm run
#                build:replay`), same as before. Now single-browser input
#                (no more WebKit job in this workflow) — still QA-only, still
#                never blocks `build`/`deploy` (see `build` below).
#   check-latest — push / workflow_dispatch only. Stale-run guard (see
#                e2e/scripts/check-latest-main.mjs): is this run's commit
#                still origin/main's actual tip?
#   build      — SES-CI-SPEED-2: no Flutter build here at all anymore (no
#                analyze/test — SES-TEST-STRATEGY-1 — and, as of this
#                change, no second `flutter build web` either): downloads
#                `flutter-validate`'s own `build-web` artifact (same commit,
#                already verified by `flutter-validate`/`smoke-e2e`, already
#                confirmed by `check-latest` to still be main's tip, and
#                already built with the exact `--base-href` Pages needs) and
#                uses it as-is for the Pages payload, plus best-effort
#                fold-in of this *same run's* e2e-replay-package artifact +
#                upload-pages-artifact. Does NOT `needs: replay-package` —
#                replay packaging is a QA convenience, not a game-deploy
#                gate (see the original design rationale preserved below).
#   deploy     — re-verify the stale guard immediately before
#                actions/deploy-pages, then deploy.
#
# What blocks build/deploy: `flutter-validate`, `replay-unit`, or `smoke-e2e`
# failing, or the stale-SHA guard failing. What does NOT block
# build/deploy: replay-package failing/timing out/not finishing in time
# (QA/dev tooling only), and — because it no longer runs in this workflow at
# all — anything in e2e-heavy.yml (WebKit, annual route, Recovery, multi-
# viewport).
#
# PRs only ever run flutter-validate/replay-unit/smoke-e2e (see each downstream job's `if:`) —
# no Pages deploy happens for pull_request events.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seeds:
        description: "Comma-separated seed override for founding-first-assignment.spec.ts's smoke sample (default: fast 3-seed sample). For the full 10-seed validation pass or the rest of the suite (WebKit, annual route, Recovery, multi-viewport), use the 'Heavy E2E (S.E.S.)' workflow instead."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Independent Flutter gate: it produces the only web artifact used by smoke and Pages.
  # Keeping it separate from Node work prevents a transient npm stall from consuming
  # the Flutter test/build budget.
  flutter-validate:
    # Preserve the existing branch-protection check context while the job ID
    # remains descriptive for dependencies and artifact documentation.
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: e2e-flutter-validate-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable

      - name: flutter pub get
        working-directory: .
        run: flutter pub get

      - name: flutter analyze
        working-directory: .
        run: flutter analyze

      - name: flutter test
        working-directory: .
        run: flutter test

      # SES-CI-SPEED-2: built with the same --base-href GitHub Pages deploys
      # (see `build` job below), so this one artifact can be reused there
      # instead of a second `flutter build web` — no CDN, self-contained.
      # smoke-e2e's local static server is base-href-aware (see
      # e2e/scripts/static-server.js) specifically so this base-href
      # doesn't have to be root ("/") just to suit the local smoke run.
      - name: flutter build web (release, no CDN — Pages base-href, reused by smoke-e2e and the Pages deploy)
        working-directory: .
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr_number="$EVENT_PR_NUMBER"
          if [[ -z "$pr_number" ]]; then
            subject="$(git show -s --format=%s "$GITHUB_SHA")"
            merge_subject_pattern='^Merge pull request #([0-9]+) from '
            if [[ "$subject" =~ $merge_subject_pattern ]]; then
              pr_number="${BASH_REMATCH[1]}"
            fi
          fi
          build_info=(--dart-define="BUILD_COMMIT_SHA=$GITHUB_SHA")
          if [[ -n "$pr_number" ]]; then
            build_info+=(--dart-define="BUILD_PR_NUMBER=$pr_number")
          fi
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --no-web-resources-cdn \
            "${build_info[@]}"

      # smoke-e2e runs on its own separate runner, so the just-built web app
      # has to travel to it as an artifact rather than being found on disk.
      - name: Upload build/web (for smoke-e2e)
        uses: actions/upload-artifact@v4
        with:
          name: build-web
          path: build/web/**
          retention-days: 1


  # This stays a required PR/deploy gate. It runs in parallel with Flutter
  # validation and must pass before smoke-e2e can start, preserving replay coverage.
  replay-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: e2e-replay-unit-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install E2E dependencies (locked, cache-first)
        run: npm ci --prefer-offline --no-audit --fund=false
      # Pure Node unit tests for Replay tooling. A failure remains blocking;
      # this job only separates unrelated work so it can fail quickly.
      - name: Replay unit tests
        run: npm run test:replay-unit

  smoke-e2e:
    needs: [flutter-validate, replay-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: smoke-e2e-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies (locked, cache-first)
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Download build/web
        uses: actions/download-artifact@v4
        with:
          name: build-web
          path: build/web

      - name: Install Playwright browsers (chromium only — smoke is chromium-only by design)
        run: npx playwright install --with-deps chromium

      # Curated fast subset (SES-CI-SPEED-1): app launch + core progression
      # (founding-first-assignment, 3-seed default sample), Public Demo
      # entry + basic HOME display (public-demo-fresh-start), plus the
      # existing browser-free/fixture-based regression guards for the
      # harness itself (negligible runtime, kept here rather than only in
      # the heavy workflow so a harness regression is caught on every PR).
      # Every other spec (WebKit, annual route, Recovery, multi-viewport,
      # the other gameplay-flow specs) runs in e2e-heavy.yml instead.
      # SES-CI-SPEED-2: flutter-validate's artifact was built with
      # --base-href "/<repo>/" (matching the Pages deploy) — tell the local
      # static server to also serve it under that prefix (see
      # e2e/scripts/static-server.js's header) so the browser's own
      # base-href-relative asset requests resolve.
      - name: Run Playwright E2E (smoke, mobile-chromium)
        env:
          SES_E2E_SEEDS: ${{ github.event.inputs.seeds }}
          SES_E2E_BASE_PATH: "/${{ github.event.repository.name }}/"
          CI: "true"
        run: |
          npx playwright test --project=mobile-chromium \
            tests/founding-first-assignment.spec.ts \
            tests/public-demo-fresh-start.spec.ts \
            tests/artifacts.allowlist.spec.ts \
            tests/artifacts.watchForErrors.spec.ts \
            tests/game-state.ariaParsing.spec.ts \
            tests/seeds.spec.ts \
            tests/ses-player.completionCapOrdering.spec.ts \
            tests/ses-player.deadEndStability.spec.ts \
            tests/portable-wheel-fallback.spec.ts

      - name: Upload ses-playwright-results (smoke, mobile-chromium)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ses-playwright-results-smoke-chromium
          path: |
            e2e/test-results/**
            e2e/playwright-report/**
          retention-days: 10
          if-no-files-found: warn

  # --- E2E Replay Viewer package (dev/QA tool) ------------------------
  #
  # main-only, and deliberately `if: always()`: a FAILED smoke run is
  # exactly when the replay video is most worth having, so this must still
  # run whether smoke-e2e passed or failed. It must NOT and does not change
  # smoke-e2e's own pass/fail result — this job only ever packages an
  # already-decided result, never re-runs or re-scores anything.
  #
  # Single-browser input now (smoke-e2e is chromium-only) — the merge step
  # below still tolerates one or many `ses-playwright-results-*` artifacts
  # unchanged, so no script changes were needed for this narrower input.
  replay-package:
    needs: smoke-e2e
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    # QA-only packaging job — bounded so a stuck step (e.g. `apt-get install
    # ffmpeg` hanging on the runner image) fails this job on its own instead
    # of running for GitHub's 360-minute default.
    timeout-minutes: 10
    concurrency:
      group: e2e-replay-package-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies (locked, cache-first)
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Download smoke-e2e's raw results
        uses: actions/download-artifact@v4
        with:
          pattern: ses-playwright-results-*
          path: e2e/raw-results

      - name: Merge raw results into one tree + one report
        run: |
          set -euo pipefail
          mkdir -p test-results
          for dir in raw-results/*/test-results; do
            [ -d "$dir" ] && cp -r "$dir"/. test-results/
          done
          node -e '
            const fs = require("fs");
            const glob = require("fs").readdirSync("raw-results")
              .map((d) => `raw-results/${d}/test-results/playwright-report.json`)
              .filter((p) => fs.existsSync(p));
            if (glob.length === 0) throw new Error("no playwright-report.json found under raw-results/*/test-results/");
            const reports = glob.map((p) => JSON.parse(fs.readFileSync(p, "utf-8")));
            const merged = {
              ...reports[0],
              suites: reports.flatMap((r) => r.suites ?? []),
              errors: reports.flatMap((r) => r.errors ?? []),
            };
            fs.writeFileSync("test-results/playwright-report.json", JSON.stringify(merged));
            console.log(`merged ${glob.length} report(s) -> test-results/playwright-report.json`);
          '

      # ubuntu-latest (24.04) does not ship ffmpeg/ffprobe.
      # CI-runner-only: not a Flutter, npm, or production runtime dependency.
      - name: Install ffmpeg (CI runner only — for replay MP4 transcoding)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Build E2E replay package
        env:
          SES_REPLAY_RUN_ID: ${{ github.run_id }}
          SES_REPLAY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SES_REPLAY_COMMIT_SHA: ${{ github.sha }}
          SES_REPLAY_WORKFLOW: ${{ github.workflow }}
          SES_REPLAY_EVENT: ${{ github.event_name }}
        run: npm run build:replay

      - name: Upload e2e-replay-package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-replay-package
          path: e2e/replay-package/**
          retention-days: 10
          if-no-files-found: warn

  check-latest:
    needs: smoke-e2e
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.smoke-e2e.result != 'cancelled' &&
      needs.smoke-e2e.result != 'skipped'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      target_sha: ${{ steps.check.outputs.target_sha }}
      is_latest: ${{ steps.check.outputs.is_latest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve target commit and check it is still main's current tip
        id: check
        run: node e2e/scripts/check-latest-main.mjs "${{ github.sha }}" "https://github.com/${{ github.repository }}.git" "main" >> "$GITHUB_OUTPUT"
      - name: Stale run — log and skip
        if: steps.check.outputs.is_latest != 'true'
        run: echo "::warning::Stale run for commit ${{ steps.check.outputs.target_sha }} — main's current tip has moved on. Skipping the Pages deploy for this run to avoid rolling production back."

  # Deliberately does not `needs: replay-package` — see § `build` in the
  # jobs comment above. Nothing in this job (or `deploy`) reads
  # `needs.replay-package.result`; the download step below already treats a
  # missing/not-yet-ready artifact as a warning, not a failure.
  build:
    needs: [smoke-e2e, check-latest]
    if: |
      always() &&
      needs.check-latest.result == 'success' &&
      needs.check-latest.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    # Least privilege: only build/deploy need Pages credentials — kept off
    # the workflow-level default so smoke-e2e (which runs npm ci /
    # Playwright / test code on every PR) never holds them.
    permissions:
      contents: read
      pages: write
      actions: read # to download this run's own e2e-replay-package artifact
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-latest.outputs.target_sha }}

      # SES-CI-SPEED-2: no `flutter analyze`/`flutter test`
      # (SES-TEST-STRATEGY-1) and, as of this change, no second
      # `flutter build web` either — this job only runs after
      # `check-latest` confirms `needs.check-latest.outputs.target_sha`
      # (this checkout's ref) is still origin/main's current tip, i.e. the
      # exact same commit `flutter-validate` already built+verified earlier in this
      # same run. `flutter-validate` now builds with the identical `--base-href`
      # this deploy needs (see flutter-validate's own build step), so its
      # `build-web` artifact is reused here as-is instead of rebuilding.
      - name: Download build/web (flutter-validate's build, same --base-href as this deploy)
        uses: actions/download-artifact@v4
        with:
          name: build-web
          path: build/web

      # --- E2E Replay Viewer (dev/QA tool) — folded into the same deploy ---
      #
      # Never touches lib/, web/, or any production build step above; this
      # only adds a static subdirectory to the already-built output.
      # Same workflow run as `replay-package`, so no run-id/cross-run token
      # needed — this simply downloads the artifact that job's own upload
      # step produces, IF that job has already produced it by the time this
      # step runs. `build` no longer `needs: replay-package` (§ jobs comment
      # at the top of this file), so this is a best-effort race, not a
      # guarantee: absent when `replay-package` didn't run at all (e.g. a
      # workflow_dispatch run), itself failed/timed out, or simply hasn't
      # finished uploading yet. Any of those is treated identically —
      # `continue-on-error` below turns "not found" into a warning, never a
      # failure.
      - name: Download e2e-replay-package
        id: download_replay
        continue-on-error: true # missing/failed artifact must not block the game deploy
        uses: actions/download-artifact@v4
        with:
          name: e2e-replay-package
          path: e2e-replay-download

      - name: Assemble Replay Viewer into the Pages payload
        if: steps.download_replay.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p build/web/e2e-replays
          cp -r e2e/replay-viewer/. build/web/e2e-replays/
          find build/web/e2e-replays -name '*.test.mjs' -delete
          cp -r e2e-replay-download/. build/web/e2e-replays/
          echo "Replay Viewer assembled at build/web/e2e-replays/ ($(find build/web/e2e-replays -type f | wc -l) files)"

      - name: Replay package unavailable for this deployment
        if: steps.download_replay.outcome != 'success'
        run: |
          echo "::warning::e2e-replay-package artifact not found for this run (event=${{ github.event_name }}) — deploying the game without updating /e2e-replays/ this time."

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: [check-latest, build]
    if: |
      always() &&
      needs.check-latest.result == 'success' &&
      needs.build.result == 'success' &&
      needs.check-latest.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Re-verify RIGHT BEFORE the real deploy-pages call — the
      # authoritative gate. `build`'s own `flutter build web` can take
      # several minutes; a newer commit could have become main's tip during
      # that window even though this run passed the check-latest job's
      # earlier (best-effort/efficiency-only) check.
      - name: Re-verify main has not moved since this run started
        id: recheck
        run: node e2e/scripts/check-latest-main.mjs "${{ needs.check-latest.outputs.target_sha }}" "https://github.com/${{ github.repository }}.git" "main" >> "$GITHUB_OUTPUT"

      - name: Stale at deploy time — skip deploy-pages
        if: steps.recheck.outputs.is_latest != 'true'
        run: echo "::warning::main moved during this run (target ${{ needs.check-latest.outputs.target_sha }} vs current ${{ steps.recheck.outputs.current_sha }}) — refusing to deploy a stale commit over a newer one."

      - id: deployment
        if: steps.recheck.outputs.is_latest == 'true'
        uses: actions/deploy-pages@v4
