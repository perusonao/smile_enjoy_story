name: Deploy Flutter Web to GitHub Pages

# Triggered by the Playwright E2E workflow's completion on main (instead of
# `push: [main]` directly) so this — the *only* workflow that ever calls
# deploy-pages — can wait for e2e.yml's `e2e-replay-package` artifact and
# fold the E2E Replay Viewer (dev/QA tool, e2e/replay-viewer/) into the
# same single Pages deployment at /e2e-replays/, without a second workflow
# racing it to deploy-pages. This does mean the game's Pages deployment now
# happens a few minutes after merge (once E2E finishes) rather than
# immediately on push — an accepted trade-off (approved design).
#
# A red E2E run does NOT block the game deployment: the steps below always
# build+deploy the game, and only conditionally fold in replay data when
# the e2e-replay-package artifact is actually available (e2e.yml packages
# it with `if: always()`, so it exists for both passed and failed runs —
# see e2e.yml for why a failed run's replay is exactly the interesting
# one). If the artifact is missing for this run (e.g. e2e.yml failed before
# reaching the packaging step), the game still deploys; only
# /e2e-replays/ is temporarily absent from that one deployment, restored by
# the next successful packaging run.
#
# Stale-run / rollback protection (Codex Major 1): e2e.yml runs for two
# different main commits can finish (and so fire their workflow_run event)
# out of order — the run for an OLDER commit is not guaranteed to complete
# before a NEWER commit's run does. Relying on this workflow's own
# `concurrency:` group to serialize things is NOT a "latest commit always
# deploys last" guarantee — it only serializes whichever runs happen to
# already be queued, in whatever order their *events* arrived, which is not
# necessarily git history order. So every run here explicitly re-checks
# "is my target commit still origin/main's actual tip?" — once cheaply at
# the very start (job `check-latest`, to skip wasted work for an
# already-stale run), and again immediately before the real
# `actions/deploy-pages` call in the `deploy` job (closing the race that
# can open up during the minutes `build` spends on `flutter build web`).
# The same check applies uniformly to workflow_dispatch too (target_sha
# falls back to `github.sha`, i.e. whatever commit was current when
# dispatched) — a manual re-run queued behind a newer push is refused the
# same way, never silently rolling production back to an older commit.
on:
  workflow_run:
    workflows: ["Playwright E2E (S.E.S.)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # to download e2e.yml's e2e-replay-package artifact (workflow_run cross-run download)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-latest:
    runs-on: ubuntu-latest
    # Only ever consider deploying for: a manual dispatch, or an e2e.yml run
    # that itself ran on a `push` to main (never a PR run) and wasn't
    # cancelled (a cancelled run — e.g. superseded by a newer push — has no
    # reliable replay package and a newer chain will deploy right behind it
    # anyway).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion != 'cancelled')
    outputs:
      target_sha: ${{ steps.check.outputs.target_sha }}
      is_latest: ${{ steps.check.outputs.is_latest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve target commit and check it is still main's current tip
        id: check
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: node e2e/scripts/check-latest-main.mjs "$TARGET_SHA" "https://github.com/${{ github.repository }}.git" "main" >> "$GITHUB_OUTPUT"
      - name: Stale run — log and skip
        if: steps.check.outputs.is_latest != 'true'
        run: echo "::warning::Stale run for commit ${{ steps.check.outputs.target_sha }} — main's current tip has moved on. Skipping the Pages deploy for this run to avoid rolling production back."

  build:
    needs: check-latest
    if: needs.check-latest.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-latest.outputs.target_sha }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web (release)
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --no-web-resources-cdn

      # --- E2E Replay Viewer (dev/QA tool) — folded into the same deploy ---
      #
      # Never touches lib/, web/, or any production build step above; this
      # only adds a static subdirectory to the already-built output.
      - name: Download e2e-replay-package
        if: github.event_name == 'workflow_run'
        id: download_replay
        continue-on-error: true # missing/failed artifact must not block the game deploy
        uses: actions/download-artifact@v4
        with:
          name: e2e-replay-package
          path: e2e-replay-download
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble Replay Viewer into the Pages payload
        if: github.event_name == 'workflow_run' && steps.download_replay.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p build/web/e2e-replays
          cp -r e2e/replay-viewer/. build/web/e2e-replays/
          find build/web/e2e-replays -name '*.test.mjs' -delete
          cp -r e2e-replay-download/. build/web/e2e-replays/
          echo "Replay Viewer assembled at build/web/e2e-replays/ ($(find build/web/e2e-replays -type f | wc -l) files)"

      - name: Replay package unavailable for this deployment
        if: github.event_name == 'workflow_run' && steps.download_replay.outcome != 'success'
        run: |
          echo "::warning::e2e-replay-package artifact not found for workflow_run ${{ github.event.workflow_run.id }} (conclusion=${{ github.event.workflow_run.conclusion }}) — deploying the game without updating /e2e-replays/ this time."

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: [check-latest, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Re-verify RIGHT BEFORE the real deploy-pages call — the
      # authoritative gate. `build`'s own `flutter build web` can take
      # several minutes; a newer commit could have become main's tip during
      # that window even though this run passed the check-latest job's
      # earlier (best-effort/efficiency-only) check.
      - name: Re-verify main has not moved since this run started
        id: recheck
        run: node e2e/scripts/check-latest-main.mjs "${{ needs.check-latest.outputs.target_sha }}" "https://github.com/${{ github.repository }}.git" "main" >> "$GITHUB_OUTPUT"

      - name: Stale at deploy time — skip deploy-pages
        if: steps.recheck.outputs.is_latest != 'true'
        run: echo "::warning::main moved during this run (target ${{ needs.check-latest.outputs.target_sha }} vs current ${{ steps.recheck.outputs.current_sha }}) — refusing to deploy a stale commit over a newer one."

      - id: deployment
        if: steps.recheck.outputs.is_latest == 'true'
        uses: actions/deploy-pages@v4
